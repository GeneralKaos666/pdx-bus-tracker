plugins {
    id 'com.android.library'
    id 'org.jetbrains.kotlin.plugin.compose'
}

android {
    namespace 'com.trimettransit.tracker.feature.arrivals'
    compileSdk 37

    defaultConfig {
        minSdk 31
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_21
        targetCompatibility JavaVersion.VERSION_21
    }

    lint {
        abortOnError = true
        baseline = file("lint-baseline.xml")
    }
}

dependencies {
    implementation project(':component:transit')
    implementation project(':component:localdata')
    implementation project(':common:model')
    implementation project(':common:ui')
    implementation project(':common:utils')
    implementation platform('androidx.compose:compose-bom:2024.12.01')
    implementation 'androidx.compose.ui:ui'
    implementation 'androidx.compose.material3:material3'
    implementation 'androidx.compose.material:material-icons-extended'
    implementation 'androidx.compose.foundation:foundation'
    implementation 'androidx.activity:activity-compose:1.9.3'
    implementation 'androidx.core:core:1.15.0'
    implementation 'androidx.core:core-ktx:1.15.0'
    implementation 'org.maplibre.gl:android-sdk-opengl:13.4.1'
    implementation 'androidx.preference:preference:1.2.1'
    implementation 'net.danlew:android.joda:2.12.1'
}
