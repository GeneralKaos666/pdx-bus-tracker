name: Security

on:
  pull_request:
    branches:
      - master
  push:
    branches:
      - master
  schedule:
    - cron: "0 7 * * 1"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  dependency-review:
    # dependency-review-action diffs base/head: only meaningful on PRs.
    # Running it on push/schedule without base-ref/head-ref always errors.
    if: github.event_name == 'pull_request' && !github.event.repository.private
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      issues: write
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Dependency review
        id: dependency-review
        uses: actions/dependency-review-action@bbc44d14a204704ccc493733616cd1e93a0321ec # v5.0.1
        with:
          fail-on-severity: low

      - name: Open issue on findings
        if: failure() && steps.dependency-review.outcome == 'failure'
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        with:
          script: |
            const fs = require('fs');
            const labels = ['security', 'dependencies'];
            const prNumber = context.payload.pull_request?.number ?? 'unknown';
            let body = `Dependency review found issues on PR #${prNumber}.\n\n`;
            body += `See the run for details: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            try {
              const summaryPath = process.env.GITHUB_STEP_SUMMARY;
              if (summaryPath && fs.existsSync(summaryPath)) {
                const summary = fs.readFileSync(summaryPath, 'utf8');
                if (summary.trim().length > 0) {
                  body += `\n\n---\n\n${summary}`;
                }
              }
            } catch (e) {
              core.warning(`Could not read step summary: ${e.message}`);
            }
            const existing = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: labels.join(','),
            });
            if (existing.data.length > 0) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.data[0].number,
                body: `${body}\n\n(Another occurrence on ${new Date().toISOString().slice(0, 10)})`,
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title: `Dependency review findings - ${new Date().toISOString().slice(0, 10)}`,
                body,
                labels,
              });
            }

  secret-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      issues: write
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Gitleaks scan
        id: gitleaks
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Open issue on findings
        if: failure() && steps.gitleaks.outcome == 'failure'
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        with:
          script: |
            const labels = ['security', 'secrets'];
            const prNumber = context.payload.pull_request?.number;
            const where =
              context.eventName === 'pull_request' && prNumber
                ? `PR #${prNumber}`
                : context.eventName === 'schedule'
                  ? `scheduled scan (${context.ref})`
                  : `push to ${context.ref}`;
            const body = `Gitleaks detected potential secrets in ${where}.\n\nSee the run for details: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const existing = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: labels.join(','),
            });
            if (existing.data.length > 0) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.data[0].number,
                body: `${body}\n\n(Another occurrence on ${new Date().toISOString().slice(0, 10)})`,
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title: `Secret scan findings - ${new Date().toISOString().slice(0, 10)}`,
                body,
                labels,
              });
            }

  dependency-graph:
    # Submit only the shipped (release runtime) deps to the dependency graph. Scoping
    # out AGP/Kotlin/GPP build-classpath tooling (guava/bouncycastle/jose4j/jdom2/
    # commons-lang3/httpclient — never in the APK, and not upgradable under the
    # deliberately pinned AGP 9.5.0) stops Dependabot re-flagging them as alerts.
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Set up JDK 21
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: 21

      - name: Ensure Android SDK packages
        run: |
          export ANDROID_HOME="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$PATH"
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager --install "platform-tools" "platforms;android-37.0" "build-tools;37.0.0"

      - name: Submit dependency graph
        uses: gradle/actions/dependency-submission@ed408507eac070d1f99cc633dbcf757c94c7933a # v4
        with:
          dependency-graph-include-configurations: '^releaseRuntimeClasspath$'
