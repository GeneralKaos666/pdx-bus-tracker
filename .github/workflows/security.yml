name: Security

on:
  push:
    branches:
      - master
  schedule:
    - cron: "0 7 * * 1"

permissions:
  contents: read

jobs:
  dependency-review:
    if: ${{ !github.event.repository.private }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Dependency review
        id: dependency-review
        uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: low

      - name: Open issue on findings
        if: failure() && steps.dependency-review.outcome == 'failure'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const summaryPath = process.env.GITHUB_STEP_SUMMARY;
            let body = 'Dependency review found issues on the latest push to master.\n\n';
            body += `See the run for details: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            if (summaryPath && fs.existsSync(summaryPath)) {
              const summary = fs.readFileSync(summaryPath, 'utf8');
              if (summary.trim().length > 0) {
                body += `\n\n---\n\n${summary}`;
              }
            }
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `Dependency review findings - ${new Date().toISOString().slice(0, 10)}`,
              body,
              labels: ['security', 'dependencies'],
            });

  secret-scan:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Gitleaks scan
        id: gitleaks
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Open issue on findings
        if: failure() && steps.gitleaks.outcome == 'failure'
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `Secret scan findings - ${new Date().toISOString().slice(0, 10)}`,
              body: `Gitleaks detected potential secrets on the latest push to master.\n\nSee the run for details: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              labels: ['security', 'secrets'],
            });
