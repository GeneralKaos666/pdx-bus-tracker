name: Security

on:
  pull_request:
    branches:
      - master
  push:
    branches:
      - master
  schedule:
    - cron: "0 7 * * 1"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  dependency-review:
    # dependency-review-action diffs base/head: only meaningful on PRs.
    # Running it on push/schedule without base-ref/head-ref always errors.
    if: github.event_name == 'pull_request' && !github.event.repository.private
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      issues: write
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Dependency review
        id: dependency-review
        uses: actions/dependency-review-action@v5
        with:
          fail-on-severity: low

      - name: Open issue on findings
        if: failure() && steps.dependency-review.outcome == 'failure'
        uses: actions/github-script@v8
        with:
          script: |
            const fs = require('fs');
            const labels = ['security', 'dependencies'];
            const prNumber = context.payload.pull_request?.number ?? 'unknown';
            let body = `Dependency review found issues on PR #${prNumber}.\n\n`;
            body += `See the run for details: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            try {
              const summaryPath = process.env.GITHUB_STEP_SUMMARY;
              if (summaryPath && fs.existsSync(summaryPath)) {
                const summary = fs.readFileSync(summaryPath, 'utf8');
                if (summary.trim().length > 0) {
                  body += `\n\n---\n\n${summary}`;
                }
              }
            } catch (e) {
              core.warning(`Could not read step summary: ${e.message}`);
            }
            const existing = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: labels.join(','),
            });
            if (existing.data.length > 0) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.data[0].number,
                body: `${body}\n\n(Another occurrence on ${new Date().toISOString().slice(0, 10)})`,
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title: `Dependency review findings - ${new Date().toISOString().slice(0, 10)}`,
                body,
                labels,
              });
            }

  secret-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      issues: write
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Gitleaks scan
        id: gitleaks
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Open issue on findings
        if: failure() && steps.gitleaks.outcome == 'failure'
        uses: actions/github-script@v8
        with:
          script: |
            const labels = ['security', 'secrets'];
            const prNumber = context.payload.pull_request?.number;
            const where =
              context.eventName === 'pull_request' && prNumber
                ? `PR #${prNumber}`
                : context.eventName === 'schedule'
                  ? `scheduled scan (${context.ref})`
                  : `push to ${context.ref}`;
            const body = `Gitleaks detected potential secrets in ${where}.\n\nSee the run for details: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const existing = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: labels.join(','),
            });
            if (existing.data.length > 0) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.data[0].number,
                body: `${body}\n\n(Another occurrence on ${new Date().toISOString().slice(0, 10)})`,
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title: `Secret scan findings - ${new Date().toISOString().slice(0, 10)}`,
                body,
                labels,
              });
            }
