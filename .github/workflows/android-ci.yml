name: Android CI

on:
  pull_request:
  push:
    branches:
      - master

permissions:
  contents: read

jobs:
  build-lint-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      TRIMET_API_KEY: ${{ secrets.TRIMET_API_KEY }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew

      - name: Build, lint and unit test
        run: ./gradlew clean test lint assembleDebug --stacktrace

      - name: Changelog version matches app version
        run: python3 - <<'EOF'
import re
hdr = re.compile(r"^## What's New in v([0-9.]+)", re.M).search(open('CHANGELOG.md').read())
ver = re.compile(r'versionName = "([0-9.]+)"').search(open('app/build.gradle').read())
if not hdr or not ver or hdr.group(1) != ver.group(1):
    raise SystemExit("CHANGELOG top version must match app/build.gradle versionName")
EOF
