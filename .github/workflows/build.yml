name: Build

on:
  pull_request:
    branches:
      - master
  push:
    branches:
      - master
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Ensure Android SDK packages
        run: |
          export ANDROID_HOME="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$PATH"
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager --install "platform-tools" "platforms;android-37.0" "build-tools;37.0.0"

      - name: Check Spanish string parity
        run: bash scripts/check-strings-parity.sh

      - name: Create throwaway CI keystore
        run: |
          keytool -genkeypair -v -keystore app/release.keystore -alias release \
            -keyalg RSA -keysize 2048 -validity 30 \
            -storepass android -keypass android \
            -dname "CN=CI, OU=CI, O=CI, L=Portland, S=OR, C=US"

      - name: Run tests, lint, and debug build
        run: ./gradlew clean test lint assembleDebug -PreleaseSigningFallback=true --stacktrace
