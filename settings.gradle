pluginManagement {
    repositories {
        google()
        mavenCentral()
        gradlePluginPortal()
    }
}

rootProject.name = 'PDX Bus Tracker'
include ':app'
include ':wear'
include ':common:model'
include ':common:utils'
include ':common:ui'
include ':component:transit'
include ':component:localdata'
include ':feature:home'
include ':feature:stops'
include ':feature:trips'
include ':feature:arrivals'
include ':feature:settings'

dependencyResolutionManagement {
    repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
    repositories {
        google()
        mavenCentral()
        maven { url = uri('https://jitpack.io') }
    }
}
