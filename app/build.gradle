plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.plugin.compose'
}

android {
    namespace = "com.trimettransit.tracker"
    compileSdk 37

    defaultConfig {
        applicationId 'com.trimettransit.tracker'
        minSdk 31
        targetSdk 37
        versionCode 480
        versionName "4.8.0"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    signingConfigs {
        release {
            storeFile file("release.keystore")
            storePassword System.getenv("STORE_PASSWORD") ?: "android"
            keyAlias System.getenv("KEY_ALIAS") ?: "release"
            keyPassword System.getenv("KEY_PASSWORD") ?: "android"
        }
    }

    buildTypes {
        release {
            signingConfig = signingConfigs.release
            minifyEnabled true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        debug {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_21
        targetCompatibility JavaVersion.VERSION_21
    }

    buildFeatures {
        viewBinding = true
    }

    lint {
        abortOnError = true
        baseline = file("lint-baseline.xml")
    }

    packaging {
        resources {
            excludes += ['META-INF/DEPENDENCIES', 'META-INF/LICENSE', 'META-INF/LICENSE.txt',
                         'META-INF/NOTICE', 'META-INF/NOTICE.txt']
        }
        // Prevents Gradle from calling the incompatible x86_64 llvm-strip binary on native dependencies
        jniLibs {
            doNotStrip "**/*.so"
        }
  }
}

dependencies {
    // Modularized projects
    implementation project(':feature:home')
    implementation project(':feature:stops')
    implementation project(':feature:search')
    implementation project(':feature:vehicles')
    implementation project(':feature:arrivals')
    implementation project(':feature:settings')
    implementation project(':common:ui')
    implementation project(':common:model')
    implementation project(':component:localdata')

    // AndroidX Core
    implementation 'androidx.core:core:1.19.0'
    implementation 'androidx.appcompat:appcompat:1.7.0'
    // Compose
    implementation platform('androidx.compose:compose-bom:2026.08.00')
    implementation 'androidx.compose.ui:ui'
    implementation 'androidx.compose.material3:material3:1.4.0'
    implementation 'androidx.compose.material:material-icons-extended'
    implementation 'androidx.compose.ui:ui-tooling-preview'
    implementation 'androidx.activity:activity-compose:1.13.0'
    implementation 'androidx.compose.foundation:foundation'
    implementation 'androidx.navigation:navigation-compose:2.9.8'
    debugImplementation 'androidx.compose.ui:ui-tooling'

    // UI
    implementation 'com.google.android.material:material:1.14.0'

    // Preference/Settings
    implementation 'androidx.preference:preference:1.2.1'

    // Maps (MapLibre GL Native, OpenGL backend — the plain `android-sdk` artifact is Vulkan-only since 13.0)
    implementation 'org.maplibre.gl:android-sdk-opengl:13.5.0'

    // Testing
    testImplementation 'junit:junit:4.13.2'
}
