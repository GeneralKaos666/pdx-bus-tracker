androidComponents {
    onVariants(selector().all()) { variant ->
        def renameTask = tasks.register("renameApkFor${variant.name.capitalize()}", RenameApkTask) {
            output.set(layout.buildDirectory.dir("outputs/renamed_apks/${variant.name}"))
            variantName.set(variant.name)
            builtArtifactsLoader.set(variant.artifacts.getBuiltArtifactsLoader())
        }
        variant.artifacts.use(renameTask)
                .wiredWith { it.input }
                .toListenTo(SingleArtifact.APK.INSTANCE)
    }
}

