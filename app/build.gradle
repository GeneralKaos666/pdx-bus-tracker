plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.plugin.compose'
}

def quoteForBuildConfig = { String value ->
    def safe = (value ?: "").replace("\\", "\\\\").replace("\"", "\\\"")
    return "\"${safe}\""
}

def trimetApiKey = (project.findProperty("TRIMET_API_KEY") ?: System.getenv("TRIMET_API_KEY") ?: "").toString()
android {
    namespace "com.trimettransit.tracker"
    compileSdk 35

    defaultConfig {
        applicationId 'com.trimettransit.tracker'
        minSdk 31
        targetSdk 35
        versionCode 100
        versionName "3.0.1"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"

        buildConfigField "String", "TRIMET_API_KEY", quoteForBuildConfig(trimetApiKey)
    }

    signingConfigs {
        release {
            storeFile file("release.keystore")
            storePassword System.getenv("STORE_PASSWORD") ?: "android"
            keyAlias System.getenv("KEY_ALIAS") ?: "release"
            keyPassword System.getenv("KEY_PASSWORD") ?: "android"
        }
    }

    buildTypes {
        release {
            signingConfig signingConfigs.release
            minifyEnabled true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        debug {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildFeatures {
        viewBinding true
        buildConfig true
    }

    lint {
        abortOnError true
    }

    packaging {
        resources {
            excludes += ['META-INF/DEPENDENCIES', 'META-INF/LICENSE', 'META-INF/LICENSE.txt',
                         'META-INF/NOTICE', 'META-INF/NOTICE.txt']
        }
        // Prevents Gradle from calling the incompatible x86_64 llvm-strip binary on ML Kit dependencies
        jniLibs {
            doNotStrip "**/*.so"
        }
  }
}

dependencies {
    // AndroidX Core
    implementation 'androidx.core:core:1.15.0'
    implementation 'androidx.appcompat:appcompat:1.7.0'
    // Compose
    implementation platform('androidx.compose:compose-bom:2024.12.01')
    implementation 'androidx.compose.ui:ui'
    implementation 'androidx.compose.material3:material3'
    implementation 'androidx.compose.material:material-icons-extended'
    implementation 'androidx.compose.ui:ui-tooling-preview'
    implementation 'androidx.activity:activity-compose:1.9.3'
    implementation 'androidx.compose.foundation:foundation'
    implementation 'androidx.navigation:navigation-compose:2.8.5'
    debugImplementation 'androidx.compose.ui:ui-tooling'

    // UI
    implementation 'com.google.android.material:material:1.12.0'

    // Preference/Settings
    implementation 'androidx.preference:preference:1.2.1'

    // Networking
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'

    implementation 'com.squareup.okio:okio:3.9.1'
    // Image loading
    implementation 'com.squareup.picasso:picasso:2.8'

    // Date/Time
    implementation 'net.danlew:android.joda:2.12.1'

    // Event Bus
    implementation 'org.greenrobot:eventbus:3.3.1'

    // Maps (osmdroid)
    implementation 'org.osmdroid:osmdroid-android:6.1.18'

    // CameraX
    def camerax_version = "1.4.1"
    implementation "androidx.camera:camera-camera2:${camerax_version}"
    implementation "androidx.camera:camera-lifecycle:${camerax_version}"
    implementation "androidx.camera:camera-view:${camerax_version}"

    // ML Kit barcode scanning (bundled, no Play Services dependency)
    implementation 'com.google.mlkit:barcode-scanning:17.3.0'
    // Testing
    testImplementation 'junit:junit:4.13.2'
}
