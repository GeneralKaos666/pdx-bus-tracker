plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'org.jetbrains.kotlin.plugin.compose' version '2.0.21'
    // Uncomment these after adding google-services.json to app/:
    // id 'com.google.gms.google-services'
    // id 'com.google.firebase.crashlytics'
}

def quoteForBuildConfig = { String value ->
    def safe = (value ?: "").replace("\\", "\\\\").replace("\"", "\\\"")
    return "\"${safe}\""
}

def trimetApiKey = (project.findProperty("TRIMET_API_KEY") ?: System.getenv("TRIMET_API_KEY") ?: "").toString()
def parseAppId = (project.findProperty("PARSE_APP_ID") ?: System.getenv("PARSE_APP_ID") ?: "").toString()
def parseServerUrl = (project.findProperty("PARSE_SERVER_URL") ?: System.getenv("PARSE_SERVER_URL") ?: "").toString()

android {
    namespace "com.something15525.trimetgo.trimet_go"
    compileSdk 35

    defaultConfig {
        applicationId 'com.something15525.trimetgo.trimet_go'
        minSdk 30
        targetSdk 36
        versionCode 100
        versionName "3.0.0"
        vectorDrawables.useSupportLibrary = true
        archivesBaseName = "TriMetGo-${versionName}"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"

        buildConfigField "String", "TRIMET_API_KEY", quoteForBuildConfig(trimetApiKey)
        buildConfigField "String", "PARSE_APP_ID", quoteForBuildConfig(parseAppId)
        buildConfigField "String", "PARSE_SERVER_URL", quoteForBuildConfig(parseServerUrl)
    }

    signingConfigs {
        release {
            storeFile file("release.keystore")
            storePassword System.getenv("STORE_PASSWORD") ?: "android"
            keyAlias System.getenv("KEY_ALIAS") ?: "release"
            keyPassword System.getenv("KEY_PASSWORD") ?: "android"
        }
    }

    buildTypes {
        release {
            signingConfig signingConfigs.release
            minifyEnabled true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        debug {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = "17"
    }

    buildFeatures {
        viewBinding true
        buildConfig true
    }

    lint {
        abortOnError true
    }

    packaging {
        resources {
            excludes += ['META-INF/DEPENDENCIES', 'META-INF/LICENSE', 'META-INF/LICENSE.txt',
                         'META-INF/NOTICE', 'META-INF/NOTICE.txt']
        }
    }
}

dependencies {
    // AndroidX Core
    implementation 'androidx.core:core:1.15.0'
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'androidx.fragment:fragment:1.8.5'
    // Compose
    implementation platform('androidx.compose:compose-bom:2024.12.01')
    implementation 'androidx.compose.ui:ui'
    implementation 'androidx.compose.material3:material3'
    implementation 'androidx.compose.ui:ui-tooling-preview'
    implementation 'androidx.activity:activity-compose:1.9.3'
    implementation 'androidx.compose.foundation:foundation'
    debugImplementation 'androidx.compose.ui:ui-tooling'

    implementation 'androidx.navigation:navigation-fragment:2.8.5'
    implementation 'androidx.navigation:navigation-ui:2.8.5'
    implementation 'androidx.annotation:annotation:1.9.1'

    // UI
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'androidx.viewpager2:viewpager2:1.1.0'
    implementation 'androidx.swiperefreshlayout:swiperefreshlayout:1.1.0'
    implementation 'androidx.cardview:cardview:1.0.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.2.0'

    // Preference/Settings
    implementation 'androidx.preference:preference:1.2.1'

    // Google Play Services
    implementation 'com.google.android.gms:play-services-vision:20.1.3'
    implementation 'com.google.android.gms:play-services-basement:18.4.0'

    // Networking
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
    implementation 'com.squareup.okio:okio:3.9.1'

    // Icons (stub classes provided in source — Gradle artifacts unavailable)

    // Image loading
    implementation 'com.squareup.picasso:picasso:2.8'

    // Date/Time
    implementation 'net.danlew:android.joda:2.12.1'

    // Event Bus
    implementation 'org.greenrobot:eventbus:3.3.1'

    // Vision/Barcode scanning (QRCode)

    // Testing
    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.2.1'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.6.1'
}
